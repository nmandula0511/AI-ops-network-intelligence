services:
  - type: web
    name: aiops-backend
    env: docker
    dockerfilePath: Dockerfile.api
    plan: free
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
        description: "AWS Access Key ID for Bedrock reasoning"
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
        description: "AWS Secret Access Key for Bedrock reasoning"
      - key: AWS_DEFAULT_REGION
        value: "us-east-1"
      - key: AWS_BEDROCK_MODEL_ID
        value: "amazon.nova-pro-v1:0"
